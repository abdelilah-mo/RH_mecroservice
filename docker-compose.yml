services:
  frontend-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro

  mongo-auth:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_auth_data:/data/db

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    depends_on:
      - mongo-auth
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro

  mongo-department:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_department_data:/data/db

  department-service:
    build:
      context: .
      dockerfile: services/department-service/Dockerfile
    depends_on:
      - mongo-department
    ports:
      - "3003:3003"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro

  mongo-position:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_position_data:/data/db

  position-service:
    build:
      context: .
      dockerfile: services/position-service/Dockerfile
    depends_on:
      - mongo-position
    ports:
      - "3004:3004"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro

  mongo-employee:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_employee_data:/data/db

  employee-service:
    build:
      context: .
      dockerfile: services/employee-service/Dockerfile
    depends_on:
      - mongo-employee
    ports:
      - "3005:3005"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro

  mongo-catalogue:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_catalogue_data:/data/db

  catalogue-service:
    build:
      context: .
      dockerfile: services/catalogue-service/Dockerfile
    depends_on:
      - mongo-catalogue
    ports:
      - "3006:3006"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro

  mongo-affectation:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_affectation_data:/data/db

  affectation-service:
    build:
      context: .
      dockerfile: services/affectation-service/Dockerfile
    depends_on:
      - mongo-affectation
    ports:
      - "3007:3007"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro

  mongo-reclamation:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_reclamation_data:/data/db

  reclamation-service:
    build:
      context: .
      dockerfile: services/reclamation-service/Dockerfile
    depends_on:
      - mongo-reclamation
    ports:
      - "3008:3008"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro

volumes:
  mongo_auth_data:
  mongo_department_data:
  mongo_position_data:
  mongo_employee_data:
  mongo_catalogue_data:
  mongo_affectation_data:
  mongo_reclamation_data:
